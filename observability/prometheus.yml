global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "voice-interviewer-backend"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    # Label all metrics from this job so dashboards can filter by service
    relabel_configs:
      - target_label: service
        replacement: backend-api
