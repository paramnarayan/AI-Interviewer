server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: "backend-api-logs"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "voice-interviewer"
          service: "backend-api"
          __path__: "/logs/backend.json"

    # Parse JSON log lines and extract labels for Loki indexing
    pipeline_stages:
      - json:
          expressions:
            level: level
            session_id: session_id
            stage: stage
            service: service
      - labels:
          level:
          session_id:
          stage:
          service:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05,000"
          fallback_formats:
            - "2006-01-02T15:04:05Z07:00"
